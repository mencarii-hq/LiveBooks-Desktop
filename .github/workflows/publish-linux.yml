name: Publish (Linux)

on: workflow_dispatch

# contents: electron-builder GitHub release upload
# Separate from Mac/Win — no Apple/Azure signing secrets.
permissions:
  contents: write

jobs:
  build-linux:
    # Pin 22.04 (glibc ~2.35) so AppImages run on Debian 12 / Ubuntu 22.04 LTS.
    # ubuntu-latest is 24.04+ and links native deps against GLIBC_2.38+.
    runs-on: ubuntu-22.04

    steps:
      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Checkout Books
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate
          yarn

      - name: Run build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LIVEBOOKS_CLOUD_ORIGIN: ${{ secrets.LIVEBOOKS_CLOUD_ORIGIN }}
          VITE_LIVEBOOKS_CLOUD_ORIGIN: ${{ secrets.LIVEBOOKS_CLOUD_ORIGIN }}
        run: |
          if [ -z "$LIVEBOOKS_CLOUD_ORIGIN" ]; then
            echo "::error::LIVEBOOKS_CLOUD_ORIGIN secret is unset; refusing to bake localhost into a Linux release."
            exit 1
          fi
          case "$LIVEBOOKS_CLOUD_ORIGIN" in
            https://*) ;;
            *)
              echo "::error::LIVEBOOKS_CLOUD_ORIGIN must be an https:// URL (got non-https value)."
              exit 1
              ;;
          esac
          yarn build --linux AppImage:x64 --publish always

      - name: Tar files
        run: tar -cvf dist-linux.tar dist_electron

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-linux
          path: dist-linux.tar
